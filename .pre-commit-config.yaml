# HKG convention (card F7): single pre-commit config covering both trees.
# Setup:  pre-commit install   (or rely on husky: .husky/pre-commit runs `pre-commit run`)
# Manual: pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: mixed-line-ending
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=25000"]

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format (line-length 88)
        entry: backend/.venv/bin/ruff format
        language: system
        types: [python]
        files: ^backend/

      - id: ruff-check
        name: ruff check (line-length 88)
        entry: backend/.venv/bin/ruff check --fix
        language: system
        types: [python]
        files: ^backend/

      - id: mypy
        name: mypy
        entry: bash -c 'cd backend && .venv/bin/mypy $(for f in "$@"; do printf "%s " "${f#backend/}"; done)' _
        language: system
        types: [python]
        # tests/ excluded to match [tool.mypy] exclude in backend/pyproject.toml
        # (check.sh's `mypy .` honours the same exclusion).
        files: ^backend/app/

      - id: pylint
        name: pylint
        entry: bash -c 'cd backend && .venv/bin/pylint $(for f in "$@"; do printf "%s " "${f#backend/}"; done)' _
        language: system
        types: [python]
        files: ^backend/app/

      - id: eslint
        name: eslint (flat config)
        entry: bash -c 'cd frontend && node_modules/.bin/eslint --max-warnings 0 $(for f in "$@"; do printf "%s " "${f#frontend/}"; done)' _
        language: system
        types_or: [javascript, ts, tsx]
        files: ^frontend/

      - id: prettier
        name: prettier --check (100/2/es5, semi)
        entry: bash -c 'cd frontend && node_modules/.bin/prettier --check $(for f in "$@"; do printf "%s " "${f#frontend/}"; done)' _
        language: system
        types_or: [javascript, ts, tsx, html, json, yaml]
        files: ^frontend/

      - id: pnpm-lockfile
        name: pnpm lockfile up to date
        entry: bash -c 'cd frontend && pnpm install --frozen-lockfile --lockfile-only'
        language: system
        pass_filenames: false
        files: ^frontend/(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml)$
