server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API: proxy to the uvicorn/FastAPI backend (no URI part -> full
    # request path such as /api/health is passed through unchanged).
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SPARQL queries against QLever can take tens of seconds
        # (QLEVER_TIMEOUT_S, default 30); give nginx headroom over that.
        proxy_read_timeout 120s;
    }

    # Static assets + SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
