[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Explicit flat-layout selection so `pip install .` (Docker backend stage)
# doesn't trip on multiple top-level packages (app/, tests/).
packages = ["app"]

[tool.setuptools.package-data]
app = ["graph_config.toml"]

[project]
name = "hkg-graph-explorer-backend"
version = "0.4.0.dev0"
description = "SPARQL-backed graph API for the HKG graph visualization"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "uvicorn>=0.54",
    # F6: pinned to a GitLab TAG (not a branch) so API shapes are reproducible;
    # bump the tag deliberately, never follow main/development.
    "hkg-data-model @ git+https://codebase.helmholtz.cloud/hmc/helmholtz-kg/semantics/internal-data-model.git@1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "mypy>=2.4",
    "ruff>=0.17",
    "pylint>=4.1",
    "pip-audit>=2.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.format]
# ruff-format is the single formatter (Black-compatible), per HKG convention.

[tool.mypy]
exclude = ["tests/"]
strict = false
check_untyped_defs = true

[tool.pylint]
ignore-paths = ["tests"]
max-line-length = 120
max-args = 6
max-positional-arguments = 6
min-public-methods = 0

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 90
