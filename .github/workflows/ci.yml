# SPDX-License-Identifier: MIT
#
# F5: CI for the HKG graph-explorer monorepo.
#
#   frontend : pnpm install --frozen-lockfile, then check (tsc + eslint +
#              prettier), test (render contract suite), build (vite).
#   backend  : python 3.14, uv sync --frozen --extra dev, then check.sh
#              (ruff format/check, mypy, pylint, pytest).
#   pre-commit: all pre-commit hooks (pre-commit stage) on all files.
#   rc-image : branch tags matching *-rc.* (e.g. 0.4.0-rc.1) build the
#              Dockerfile and push to ghcr, tagged with the tag name plus a
#              rolling latest-rc. Runs only after both check jobs are green.
#   rc-smoke : pulls the pushed rc image, runs the container, and probes
#              /api/health plus the SPA (index + fallback route).
#
# Final (non-rc) releases keep going through build-and-deploy.yml, whose tag
# trigger excludes *-rc.* so an rc tag is built exactly once — behind green
# tests.

name: CI (test + lint + rc image)

on:
  pull_request:
  push:
    branches: [main, refactor/fullstack-graph-explorer]
    tags: ["*-rc.*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PNPM_VERSION: "12.16.1"

jobs:
  frontend:
    name: frontend (check + test + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install (frozen lockfile)
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Check (tsc + eslint + prettier)
        working-directory: frontend
        run: pnpm run check

      - name: Test (render contract suite)
        working-directory: frontend
        run: pnpm test

      - name: Build (vite)
        working-directory: frontend
        run: pnpm run build

  backend:
    name: backend (ruff + mypy + pylint + pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # git is preinstalled on ubuntu-latest; it is needed by uv to fetch
      # the hkg-data-model dependency, which is pinned to a GitLab tag via
      # git+https (backend/pyproject.toml, backend/uv.lock) and is publicly
      # readable.
      - name: Install (locked, dev extras)
        working-directory: backend
        run: uv sync --frozen --extra dev

      - name: Check (ruff, mypy, pylint, pytest)
        working-directory: backend
        run: bash check.sh

  pre-commit:
    name: pre-commit (all hooks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # The local mypy/pylint/eslint/prettier hooks run from the locked envs.
      - name: Install backend (locked, dev extras)
        working-directory: backend
        run: uv sync --frozen --extra dev

      - name: Install frontend (frozen lockfile)
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # Pre-push (test) hooks are not part of --all-files; the frontend and
      # backend jobs run the tests.
      - name: Run pre-commit
        run: uvx pre-commit run --all-files --show-diff-on-failure

  rc-image:
    name: rc image (ghcr)
    runs-on: ubuntu-latest
    needs: [frontend, backend, pre-commit]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tag name + rolling latest-rc)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest-rc

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  rc-smoke:
    name: rc image smoke test
    runs-on: ubuntu-latest
    needs: rc-image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to ghcr
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the rc image
        # docker pull requires a fully lowercase reference (buildx
        # normalizes on push, so the registry path is lowercase even though
        # the org name in github.repository is mixed-case).
        run: |
          IMG=$(echo "${REGISTRY}/${IMAGE_NAME}:${GITHUB_REF_NAME}" \
            | tr '[:upper:]' '[:lower:]')
          docker pull "$IMG"
          echo "IMG=$IMG" >> "$GITHUB_ENV"

      - name: Run container and probe health + SPA
        run: |
          PORT=$((2000 + RANDOM % 20000))
          docker run -d --name rc-smoke -p "${PORT}:80" "$IMG"
          sleep 10
          echo '--- /api/health'
          curl -fsS "http://127.0.0.1:${PORT}/api/health"
          echo
          echo '--- / (SPA index)'
          curl -fsS "http://127.0.0.1:${PORT}/" | head -5
          echo '--- SPA fallback /graph'
          curl -fsS -o /dev/null -w '%{http_code}\n' \
            "http://127.0.0.1:${PORT}/graph"
          docker rm -f rc-smoke >/dev/null
